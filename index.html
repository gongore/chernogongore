<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chernogongore | Web App</title>

    <!-- Link to External Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YOUR_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YOUR_MEASUREMENT_ID');
    </script>
</head>
<body>

    <div class="main-container">
        
        <!-- SECTION 1: Welcome / Status Card -->
        <div class="glass-card header-card">
            <h1>chernogongore.com</h1>
            <p>Welcome! I am currently building a full-featured financial and market portfolio web app here. Stay tuned for live market feeds, macro calendars, and custom watchlists.</p>
        </div>

        <!-- SECTION 2: Suggestion Form -->
        <div class="glass-card form-card">
            <h2>Leave a Suggestion</h2>
            <p class="subtitle">
                Have an idea for a feature or a dataset you'd like to see? Let me know below.
            </p>

            <form id="suggestion-form">
                <!-- Replace with your actual Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Your Email / Contact</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="message">Your Suggestion</label>
                    <textarea id="message" name="message" required rows="4" placeholder="What features or tools would help you most?"></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Send Suggestion</button>
            </form>

            <div id="form-result"></div>
        </div>

    </div>

    <!-- Link to External JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
